services:
  - type: web
    name: reel-cutter-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ALLOWED_ORIGINS
        value: https://reelcutter.app,https://www.reelcutter.app
      # All secrets must be set manually in Render dashboard:
      # SUPABASE_URL, SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
      # STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET
      # STRIPE_PRICE_BASIC, STRIPE_PRICE_STANDARD, STRIPE_PRICE_PRO
      # RESEND_API_KEY, EMAIL_FROM
